# Blueprint Render — serveur webhook leads Meta → Google Sheets.
# Déploiement : https://render.com → New → Blueprint → connecter ce dépôt.
# Les variables marquées sync:false se saisissent à la main dans le dashboard
# (ce sont des secrets : jamais dans le dépôt).
services:
  - type: web
    name: pausecom-meta-webhook
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      # Identifiant public de la Page Pause-Com : pas un secret.
      - key: META_PAGE_ID
        value: "112795731747614"
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEET_RANGE
        value: Leads!A:G
      # Tableau de bord /dashboard : fermé tant que le mot de passe est absent.
      - key: DASHBOARD_USER
        value: pausecom
      - key: DASHBOARD_PASSWORD
        sync: false
